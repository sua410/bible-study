<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f0">
<title>성경 문제집 - 매일 공부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성경공부">
<!--
  파일 구성
  - index.html   : 화면 뼈대 (이 파일)
  - style.css    : 디자인
  - questions.js : 문제 데이터 (문제 추가·수정은 여기서)
  - app.js       : 앱 동작 (홈, 공부하기, 퀴즈, 설정, 로그인·동기화)
  - sw.js        : 오프라인에서도 열리게 해 주는 파일
  ?v= 숫자는 업로드.command가 올릴 때마다 자동으로 바꿔요 (사용자 폰이 새 버전을 바로 받도록).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=202610221341">
<!-- Firebase (구글 로그인 + 동기화). 설정값은 app.js의 firebaseConfig -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<main class="app" id="app"></main>

<nav class="tabbar" id="tabbar">
  <div class="tabbar-in">
    <button data-tab="home"><span class="ti">🏠</span>홈</button>
    <button data-tab="study"><span class="ti">📗</span>공부하기</button>
    <button data-tab="quiz"><span class="ti">📝</span>퀴즈</button>
    <button data-tab="settings"><span class="ti">⚙️</span>설정</button>
  </div>
</nav>

<div id="toast" class="toast"></div>
<!-- 숨겨진 input - 진도 가져오기용 -->
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">

<script src="questions.js?v=202610221341"></script>
<script src="app.js?v=202610221341"></script>
<script>
  // 오프라인 지원: 한 번 열어 둔 뒤에는 인터넷이 없어도 앱이 열려요 (https 사이트에서만 동작)
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW 등록 실패', e); });
    });
  }
</script>
</body>
</html>
